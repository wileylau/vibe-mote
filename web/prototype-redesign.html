<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>vibe-mote · redesign options (PROTOTYPE)</title>
<style>
/* ============================================================
   PROTOTYPE — throwaway. Four structurally different redesigns.
   Switch with ?variant=A|B|C|D or the floating bar / arrow keys.
   Read-only: all numbers below are synthetic but true to the app.
   ============================================================ */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit}
.proto-note{position:fixed;bottom:16px;left:16px;z-index:99;background:#111;color:#fff;font:10px/1.5 ui-monospace,monospace;padding:5px 9px;border-radius:5px;letter-spacing:.03em;max-width:230px}

/* ---- shared remote drawing ---- */
.rm{position:relative;user-select:none;flex:0 0 auto}
.rm .row{display:flex;align-items:center;justify-content:center}
.rm .btn{border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:transform .1s,box-shadow .16s,background .16s}
.rm .btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rm .btn svg.fill{fill:currentColor;stroke:none}
.rm .lbl{font-size:9px;font-weight:700;letter-spacing:.02em}

/* ============================================================
   A · INSTRUMENT — dark tactile cluster, remote as the object
   ============================================================ */
.v-A{--bg:#0c0f14;--panel:#141920;--line:#232b36;--ink:#e8edf5;--mut:#7d879a;--sig:#4de0c4;--acc:#5b8cff;
  min-height:100vh;background:radial-gradient(900px 500px at 50% -8%,rgba(91,140,255,.10),transparent 62%),var(--bg);color:var(--ink);display:grid;grid-template-columns:62px 1fr 300px}
.v-A .rail{border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:8px;padding:54px 0 18px}
.v-A .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,var(--acc),#3455c0);display:grid;place-items:center;font-weight:800;font-size:15px;margin-bottom:16px}
.v-A .ric{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--mut);cursor:pointer}
.v-A .ric.on{color:var(--ink);background:var(--panel);box-shadow:inset 0 0 0 1px var(--line)}
.v-A .ric svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7}
.v-A .stage{padding:54px 34px 30px;min-width:0;display:flex;flex-direction:column;align-items:center}
.v-A .eyebrow{font:11px ui-monospace,monospace;letter-spacing:.22em;color:var(--sig);text-transform:uppercase}
.v-A h1{font-size:30px;font-weight:600;letter-spacing:-.03em;margin:10px 0 4px}
.v-A .sub{color:var(--mut);font-size:13px;margin-bottom:26px}
.v-A .cradle{position:relative;padding:30px;border-radius:28px;background:radial-gradient(circle at 50% 35%,rgba(91,140,255,.12),transparent 60%);border:1px solid var(--line)}
.v-A .cradle::after{content:"";position:absolute;left:12%;right:12%;bottom:-26px;height:30px;background:radial-gradient(ellipse,rgba(0,0,0,.6),transparent 70%);filter:blur(6px)}
.v-A .rm{width:186px;height:430px;border-radius:30px;padding:18px;background:linear-gradient(155deg,#3b434e,#1a1f26 55%,#11151a);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 24px 50px -16px #000;display:flex;flex-direction:column;gap:14px;align-items:center}
.v-A .rm .rhead{width:100%;display:flex;justify-content:space-between;padding:0 8px}
.v-A .rm .led{width:6px;height:6px;border-radius:50%;background:var(--sig);box-shadow:0 0 9px var(--sig);align-self:center}
.v-A .rm .btn{width:42px;height:42px;border-radius:50%;color:#cdd6e3;background:linear-gradient(180deg,#414a56,#2a313b);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 4px #000}
.v-A .rm .btn:hover{filter:brightness(1.15)}
.v-A .rm .mic{background:linear-gradient(180deg,#525d6d,#333c48);color:#eaf1ff}
.v-A .rm .pad{position:relative;width:132px;height:132px;border-radius:50%;background:radial-gradient(circle at 42% 30%,#3a434f,#171c22 72%);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 3px 8px #000;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);place-items:center;padding:7px}
.v-A .rm .pad .btn{width:34px;height:34px;background:transparent;box-shadow:none;border-radius:9px}
.v-A .rm .pad .ok{width:44px;height:44px;border-radius:50%;background:linear-gradient(180deg,#454f5c,#2b323b);font-size:11px;font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.13)}
.v-A .rm .pill{width:58px;height:44px;border-radius:12px}
.v-A .rm .btn.lit{background:linear-gradient(180deg,var(--sig),#25a98f);color:#04120f;box-shadow:0 0 22px rgba(77,224,196,.75),0 0 0 3px rgba(77,224,196,.22);transform:translateY(1px) scale(.95)}
.v-A .rm .rock{position:absolute;right:-9px;top:44%;display:flex;flex-direction:column;border-radius:7px;overflow:hidden;box-shadow:0 3px 7px #000}
.v-A .rm .rock .btn{width:19px;height:34px;border-radius:0;font-size:13px}
.v-A .events{margin-top:26px;width:min(560px,100%);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.v-A .events .eh{padding:9px 14px;font:10px ui-monospace,monospace;letter-spacing:.18em;color:var(--mut);border-bottom:1px solid var(--line)}
.v-A .events .er{display:flex;align-items:center;gap:12px;padding:8px 14px;font:11.5px ui-monospace,monospace;border-bottom:1px solid var(--line);color:#aab4c4}
.v-A .events .er:last-child{border:0}
.v-A .events .er .d{color:var(--sig)}
.v-A .tele{border-left:1px solid var(--line);padding:54px 18px 18px;display:flex;flex-direction:column;gap:14px}
.v-A .gauge{border:1px solid var(--line);border-radius:14px;padding:15px;background:var(--panel)}
.v-A .gauge .gl{font:10px ui-monospace,monospace;letter-spacing:.16em;color:var(--mut)}
.v-A .gauge .gv{font-size:20px;font-weight:600;margin:8px 0 4px}
.v-A .gauge .track{height:4px;border-radius:4px;background:#222a35;margin-top:10px;overflow:hidden}
.v-A .gauge .track i{display:block;height:100%;border-radius:4px;background:var(--sig)}
.v-A .gauge.warn .gv{color:#ffca6a}
.v-A .gauge.warn .track i{background:#ffca6a}
.v-A .mini{margin-top:auto;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel);font:11px ui-monospace,monospace;color:var(--mut);line-height:1.9}
.v-A .mini b{color:var(--ink);font-weight:600}

/* ============================================================
   B · COMMAND DECK — light, dense, data-forward grid
   ============================================================ */
.v-B{--bg:#f6f7f9;--panel:#fff;--line:#e2e5ea;--ink:#16181d;--mut:#6b7280;--acc:#4f46e5;--ok:#0f9f6e;
  background:var(--bg);color:var(--ink);min-height:100vh;font-size:13px}
.v-B .top{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:26px;padding:0 26px;position:sticky;top:0}
.v-B .brand{font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
.v-B .brand i{width:22px;height:22px;border-radius:6px;background:var(--acc);display:grid;place-items:center;color:#fff;font-style:normal;font-size:12px}
.v-B .tabs{display:flex;gap:4px}
.v-B .tab{padding:7px 12px;border-radius:7px;color:var(--mut);cursor:pointer}
.v-B .tab.on{background:#eef0fe;color:var(--acc);font-weight:600}
.v-B .pill{margin-left:auto;display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--mut);font-size:12px}
.v-B .pill i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.v-B .btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 12px;cursor:pointer;color:var(--ink)}
.v-B .btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.v-B .wrap{max-width:1240px;margin:0 auto;padding:22px 26px 40px}
.v-B .grid{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:14px}
.v-B .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.v-B .card h3{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin:0 0 14px;font-weight:700}
.v-B .card.span2{grid-column:span 2}
.v-B .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.v-B .kpi{border:1px solid var(--line);border-radius:10px;padding:13px}
.v-B .kpi .n{font-size:26px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.v-B .kpi .l{font-size:11px;color:var(--mut);margin-top:2px}
.v-B .kpi.bad .n{color:#d13b3b}
.v-B .rows{display:flex;flex-direction:column}
.v-B .r{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.v-B .r:last-child{border:0}
.v-B .r .k{color:var(--mut)}
.v-B .r .v{font-variant-numeric:tabular-nums;text-align:right}
.v-B .tag{font:10px ui-monospace,monospace;padding:2px 7px;border-radius:5px;background:#eef0fe;color:var(--acc)}
.v-B .tag.ok{background:#e6f7ef;color:var(--ok)}
.v-B .tag.mut{background:#f0f1f3;color:var(--mut)}
.v-B .check{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.v-B .check:last-child{border:0}
.v-B .check .box{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--ok);background:#e6f7ef;color:var(--ok);display:grid;place-items:center;font-size:10px;font-weight:800;flex:0 0 16px}
.v-B .check.miss .box{border-color:#d13b3b;background:#fdecec;color:#d13b3b}
.v-B .check .t{flex:1}
.v-B .check .sub{font-size:10.5px;color:var(--mut)}
.v-B .remote-mini{display:flex;justify-content:center;padding:6px 0 2px}
.v-B .rm{width:104px;height:250px;border-radius:18px;padding:11px;background:linear-gradient(155deg,#3d434c,#191d22);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 10px 20px -8px #000;display:flex;flex-direction:column;gap:8px;align-items:center}
.v-B .rm .rhead{width:100%;display:flex;justify-content:space-between;padding:0 4px}
.v-B .rm .led{width:4px;height:4px;border-radius:50%;background:var(--acc)}
.v-B .rm .btn{width:24px;height:24px;border-radius:50%;color:#c9d0da;background:#3a414b}
.v-B .rm .btn svg{width:11px;height:11px}
.v-B .rm .pad{width:76px;height:76px;border-radius:50%;background:#22272e;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);place-items:center;padding:4px}
.v-B .rm .pad .btn{width:20px;height:20px;background:transparent;border-radius:5px}
.v-B .rm .pad .ok{width:26px;height:26px;background:#454c56;font-size:7px}
.v-B .rm .pill{width:32px;height:24px;border-radius:7px}
.v-B .rm .lbl{font-size:6px}
.v-B .rm .rock{position:absolute;right:-6px;top:44%;display:flex;flex-direction:column}
.v-B .rm .rock .btn{width:11px;height:19px;border-radius:0}
.v-B .rm .btn.lit{background:var(--acc);color:#fff;box-shadow:0 0 12px var(--acc)}
.v-B table{width:100%;border-collapse:collapse;font-size:12px}
.v-B td{padding:7px 4px;border-bottom:1px solid var(--line)}
.v-B td:last-child{text-align:right;font-family:ui-monospace,monospace;color:var(--acc)}
.v-B .feed .f{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font:11.5px ui-monospace,monospace}
.v-B .feed .f:last-child{border:0}
.v-B .feed .t{color:var(--mut)}
.v-B .feed .k{color:var(--acc);font-weight:700}
.v-B .actions{display:flex;flex-wrap:wrap;gap:8px}
.v-B .actions .btn{font-size:12px}

/* ============================================================
   C · FIELD MANUAL — warm editorial, narrative setup
   ============================================================ */
.v-C{--paper:#f3efe6;--ink:#221f1a;--mut:#6f685d;--rule:#d8d1c3;--sig:#c9502e;
  background:var(--paper);color:var(--ink);min-height:100vh}
.v-C .top{max-width:960px;margin:0 auto;padding:26px 28px 0;display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--rule)}
.v-C .brand{font:700 15px Georgia,serif;letter-spacing:.01em}
.v-C .brand span{font:400 11px ui-monospace,monospace;color:var(--mut);margin-left:10px}
.v-C .conn{font:11px ui-monospace,monospace;color:var(--sig)}
.v-C main{max-width:960px;margin:0 auto;padding:48px 28px 70px}
.v-C .hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding-bottom:40px;border-bottom:1px solid var(--rule)}
.v-C h1{font:400 52px/1.04 Georgia,"Times New Roman",serif;letter-spacing:-.03em;margin:0 0 16px}
.v-C h1 em{font-style:italic;color:var(--sig)}
.v-C .lead{font:16px/1.65 Georgia,serif;color:var(--mut);max-width:44ch}
.v-C .rm{width:150px;height:360px;margin:auto;border-radius:24px;padding:16px;background:#26282a;border:1px solid #4a4d50;box-shadow:0 18px 34px -16px rgba(34,31,26,.5);display:flex;flex-direction:column;gap:12px;align-items:center}
.v-C .rm .rhead{width:100%;display:flex;justify-content:space-between;padding:0 6px}
.v-C .rm .led{width:5px;height:5px;border-radius:50%;border:1px solid #9a9ea3;align-self:center}
.v-C .rm .btn{width:34px;height:34px;border-radius:50%;background:transparent;border:1.5px solid #979b9f;color:#d7dadd}
.v-C .rm .btn svg{width:15px;height:15px}
.v-C .rm .pad{width:108px;height:108px;border-radius:50%;border:1.5px solid #979b9f;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);place-items:center}
.v-C .rm .pad .btn{width:28px;height:28px;border:0}
.v-C .rm .pad .ok{width:36px;height:36px;border:1.5px solid #979b9f;font:700 9px ui-monospace,monospace}
.v-C .rm .pill{width:46px;height:34px;border-radius:11px}
.v-C .rm .lbl{font:700 7px ui-monospace,monospace;letter-spacing:.08em}
.v-C .rm .rock{position:absolute;right:-7px;top:44%;display:flex;flex-direction:column}
.v-C .rm .rock .btn{width:15px;height:26px;border-radius:5px;font:700 11px ui-monospace,monospace}
.v-C .rm .btn.lit{background:var(--sig);border-color:var(--sig);color:#fff;box-shadow:0 0 16px rgba(201,80,46,.6)}
.v-C .figcap{text-align:center;font:italic 12px Georgia,serif;color:var(--mut);margin-top:12px}
.v-C .sec{margin-top:46px}
.v-C .sec h2{font:400 13px ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--sig);margin:0 0 22px}
.v-C .step{display:grid;grid-template-columns:46px 1fr auto;gap:16px;padding:18px 0;border-bottom:1px solid var(--rule);align-items:start}
.v-C .step:last-child{border:0}
.v-C .step .num{font:400 22px Georgia,serif;color:var(--mut)}
.v-C .step .body h4{font:600 16px Georgia,serif;margin:0 0 5px}
.v-C .step .body p{font:13.5px/1.6 Georgia,serif;color:var(--mut);margin:0;max-width:58ch}
.v-C .step .state{font:11px ui-monospace,monospace;padding:4px 9px;border:1px solid var(--ok, #3b7a55);color:#3b7a55;border-radius:2px;white-space:nowrap}
.v-C .step .state.no{border-color:#b6533a;color:#b6533a}
.v-C .note{margin-top:44px;padding:20px 22px;border-left:2px solid var(--sig);background:rgba(201,80,46,.05);font:14px/1.7 Georgia,serif;color:var(--ink)}
.v-C .note b{color:var(--sig)}

/* ============================================================
   D · ONE SCREEN — full-bleed device, HUD, dock
   ============================================================ */
.v-D{--bg:#07090c;--ink:#f2f5fa;--mut:#7b8593;--live:#c9ff4d;--acc:#6ea8ff;
  background:radial-gradient(700px 700px at 50% 42%,rgba(110,168,255,.10),transparent 70%),var(--bg);color:var(--ink);min-height:100vh;position:relative;overflow:hidden}
.v-D .hud{position:absolute;top:26px;left:30px;right:30px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.v-D .word{font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
.v-D .word i{width:26px;height:26px;border-radius:8px;background:linear-gradient(145deg,var(--acc),#2c4ea8);display:grid;place-items:center;font-style:normal;font-size:13px}
.v-D .stat{display:flex;align-items:center;gap:8px;border:1px solid #232a35;border-radius:999px;padding:7px 14px;font:11px ui-monospace,monospace;color:var(--mut)}
.v-D .stat i{width:7px;height:7px;border-radius:50%;background:var(--live);box-shadow:0 0 10px var(--live)}
.v-D .center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:80px 20px 120px}
.v-D .rm{width:210px;height:500px;border-radius:36px;padding:22px;background:linear-gradient(160deg,#2f353d,#151a20 55%,#0e1216);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 40px 80px -24px #000,0 0 90px -40px var(--acc);display:flex;flex-direction:column;gap:18px;align-items:center}
.v-D .rm .rhead{width:100%;display:flex;justify-content:space-between;padding:0 8px}
.v-D .rm .led{width:7px;height:7px;border-radius:50%;background:var(--live);box-shadow:0 0 12px var(--live);align-self:center}
.v-D .rm .btn{width:46px;height:46px;border-radius:50%;color:#d3dae4;background:linear-gradient(180deg,#3e4650,#272e37);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 3px 6px #000}
.v-D .rm .btn svg{width:19px;height:19px}
.v-D .rm .mic{background:linear-gradient(180deg,#4d5765,#303844);color:#eef4ff}
.v-D .rm .pad{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 42% 30%,#39414c,#12171c 72%);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 4px 10px #000;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);place-items:center;padding:8px}
.v-D .rm .pad .btn{width:38px;height:38px;background:transparent;box-shadow:none;border-radius:10px}
.v-D .rm .pad .ok{width:50px;height:50px;border-radius:50%;background:linear-gradient(180deg,#444d58,#2a313a);font-size:12px;font-weight:800}
.v-D .rm .pill{width:64px;height:48px;border-radius:14px}
.v-D .rm .btn.lit{background:var(--live);color:#0a0f04;box-shadow:0 0 28px rgba(201,255,77,.8);transform:scale(.95)}
.v-D .rm .rock{position:absolute;right:-10px;top:44%;display:flex;flex-direction:column;border-radius:8px;overflow:hidden}
.v-D .rm .rock .btn{width:20px;height:38px;border-radius:0;font-size:14px}
.v-D .caption{font:11px ui-monospace,monospace;color:var(--mut);letter-spacing:.05em}
.v-D .ticker{position:absolute;left:0;right:0;bottom:86px;display:flex;justify-content:center;gap:22px;font:11px ui-monospace,monospace;color:var(--mut);pointer-events:none}
.v-D .ticker b{color:var(--live);font-weight:500}
.v-D .dock{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:7px;background:rgba(20,25,32,.9);border:1px solid #232a35;border-radius:16px;backdrop-filter:blur(10px);z-index:3}
.v-D .dock button{border:0;background:transparent;color:var(--mut);padding:9px 15px;border-radius:10px;cursor:pointer;font:11px ui-monospace,monospace}
.v-D .dock button.on{background:var(--acc);color:#fff}

/* ============================================================
   E · NATIVE — clean desktop-software look (Fluent / Win11 Settings)
   Familiar chrome, standard controls, system type, no hero object.
   ============================================================ */
.v-E{--win:#f3f3f3;--pane:#fff;--ln:#e5e5e5;--ln2:#f0f0f0;--tx:#1b1b1b;--mut:#616161;--acc:#0067c0;
  background:var(--win);color:var(--tx);font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;font-size:13px;min-height:100vh}
.v-E .titlebar{height:36px;background:var(--win);border-bottom:1px solid var(--ln);display:flex;align-items:center;padding:0 12px;gap:10px}
.v-E .wico{width:16px;height:16px;border-radius:4px;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700}
.v-E .wtitle{font-size:12px;font-weight:600}
.v-E .wctl{margin-left:auto;display:flex;color:#555}
.v-E .wctl span{width:42px;height:36px;display:grid;place-items:center;font-size:11px}
.v-E .shell{display:grid;grid-template-columns:228px 1fr;min-height:calc(100vh - 36px)}
.v-E .nav{padding:16px 10px;border-right:1px solid var(--ln)}

   LED at top. Shared by every variant; sized with container units.

.rm{container-type:size}
.rm .rled{position:absolute;top:5cqh;left:50%;transform:translateX(-50%);width:3cqw;height:3cqw;border-radius:50%;background:#6fe39a;box-shadow:0 0 6px #6fe39a}
.rm .rpad{position:absolute;top:7cqh;left:50%;transform:translateX(-50%);width:68cqw;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 42% 32%,#3c434c,#161b20 74%);box-shadow:inset 0 1px 0 #ffffff1f,0 2px 8px #0008;
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);place-items:center}
.rm .rkey{border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5cqh;

  transition:transform .1s,box-shadow .16s,background .16s}
.rm .rkey svg{width:7cqw;height:7cqw;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.rm .rcol{display:flex;flex-direction:column;align-items:center;gap:6cqh}

var V=[{k:"A",n:"Instrument",f:A},{k:"B",n:"Command Deck",f:B},{k:"C",n:"Field Manual",f:C},{k:"D",n:"One Screen",f:OneScreen},{k:"E",n:"Native",f:Native},{k:"F",n:"Native + Hero",f:NativeHero}];
function current(){
  var m=location.search.match(/[?&]variant=([A-F])/i)||location.hash.match(/variant=([A-F])/i);
  return m?m[1].toUpperCase():"A";
}
function show(k){
  var v=V.filter(function(x){return x.k===k})[0]||V[0];
  document.getElementById("app").innerHTML=v.f();
  document.getElementById("lab").innerHTML="<b>"+v.k+"</b> · "+v.n;
  try{history.replaceState(null,"",location.pathname+"?variant="+v.k)}catch(e){location.hash="variant="+v.k}
  wireRemote();
}
function wireRemote(){
  Array.prototype.forEach.call(document.querySelectorAll(".rm .btn[data-k]"),function(b){
    b.addEventListener("click",function(){
      b.classList.add("lit");
      setTimeout(function(){b.classList.remove("lit")},420);
    });
  });
}
document.getElementById("prev").onclick=function(){var i=V.map(function(x){return x.k}).indexOf(current());show(V[(i-1+V.length)%V.length].k)};
document.getElementById("next").onclick=function(){var i=V.map(function(x){return x.k}).indexOf(current());show(V[(i+1)%V.length].k)};
window.addEventListener("keydown",function(e){
  if(/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  var i=V.map(function(x){return x.k}).indexOf(current());
  if(e.key==="ArrowLeft"){show(V[(i-1+V.length)%V.length].k)}
  if(e.key==="ArrowRight"){show(V[(i+1)%V.length].k)}
});
show(current());
</script>
